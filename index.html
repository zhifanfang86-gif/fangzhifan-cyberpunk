<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>访志帆 — 个人主页</title>
    <meta name="description" content="访志帆 — AI构建、全栈架构、网络安全"/>
    <link rel="preconnect" href="https://fonts.loli.net"/>
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin=""/>
    <link href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@400;600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet"/>
    <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <script type="module" crossorigin="" src="./assets/index-4r6Lbbs.js"></script>
    <link rel="stylesheet" crossorigin="" href="./assets/index-BYiqeDSS.css"/>
    <link rel="stylesheet" href="./assets/guestbook.css"/>
    <!-- 注：替换字体文件的路径为本地或国内 CDN -->
    <script src="./assets/text-replacement.js"></script>
</head>
<body>
    <!-- 视频滚动背景 -->
    <div class="video-scroll-container" id="video-container">
        <video id="scroll-video" muted playsinline preload="auto" loop>
            <source src="https://videos.pexels.com/video-files/3129671/3129671-hd_1920_1080_30fps.mp4" type="video/mp4">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-futuristic-devices-9976-large.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
        <div class="video-fallback" id="video-fallback"></div>
    </div>

    <!-- React 应用挂载点 -->
    <div id="root"></div>

    <!-- 尺牍留言板 -->

    <!-- 联系表单 -->
    <section class="guestbook-section" id="contact">
        <div class="guestbook-inner">
            <h2 class="guestbook-title">
                <span class="guestbook-mark">投</span>
                <span>投递</span>
                <span class="guestbook-line"></span>
            </h2>

            <form class="guestbook-form" id="contact-form">
                <div class="form-field">
                    <label>称呼</label>
                    <input type="text" id="contact-name" placeholder="阁下尊姓大名" required>
                </div>
                <div class="form-field">
                    <label>邮箱</label>
                    <input type="email" id="contact-email" placeholder="如需回复，请留下邮箱">
                </div>
                <div class="form-field">
                    <label>留言</label>
                    <textarea id="contact-message" placeholder="详述需求..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">发送邮件</button>
            </form>

            <div id="contact-result" style="margin-top:24px;font-size:0.9rem;color:#5a8a7e;"></div>
        </div>
    </section>
    <section class="guestbook-section" id="guestbook">
        <div class="guestbook-inner">
            <h2 class="guestbook-title">
                <span class="guestbook-mark">尺</span>
                <span>尺牍</span>
                <span class="guestbook-line"></span>
            </h2>

            <form class="guestbook-form" id="guestbook-form">
                <div class="form-field">
                    <label>称呼</label>
                    <input type="text" id="name" placeholder="尊姓大名" required>
                </div>
                <div class="form-field">
                    <label>留言</label>
                    <textarea id="message" placeholder="在此留墨..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">投递尺牍</button>
            </form>

            <div id="messages" class="messages"></div>
        </div>
    </section>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script src="./assets/guestbook.js"></script>
    <script src="./assets/video-scroll.js"></script>

    <script>
    (function() {
        var form = document.getElementById('contact-form');
        var result = document.getElementById('contact-result');
        function showContact(msg, ok) {
            result.textContent = msg;
            result.style.color = ok ? '#5a8a7e' : '#c45c48';
        }
        if (form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                var name = document.getElementById('contact-name').value.trim();
                var email = document.getElementById('contact-email').value.trim();
                var message = document.getElementById('contact-message').value.trim();
                if (!name || !message) {
                    showContact('请填写称呼和留言', false);
                    return;
                }
                showContact('发送中...', true);
                fetch('/api/contact', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name: name, email: email, message: message})
                }).then(function(r) {
                    return r.json();
                }).then(function(data) {
                    if (data.success) {
                        showContact('✓ 邮件已发送，我会尽快回复', true);
                        form.reset();
                    } else {
                        showContact('发送失败: ' + (data.error || '未知错误'), false);
                    }
                }).catch(function(err) {
                    showContact('网络错误: ' + err.message, false);
                });
            });
        }
    })();
    </script>
</body>
</html>
