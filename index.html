<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方志凡 — 微微赛博</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap');

        :root {
            --paper: #f7f4ec;
            --paper-warm: #f0ece3;
            --paper-rule: rgba(160, 140, 110, 0.12);
            --ink: #2a2a2a;
            --ink-light: #5a5a5a;
            --ink-faint: #9e9a94;
            --cinnabar: #c45c48;
            --cinnabar-soft: rgba(196, 92, 72, 0.08);
            --stone: #5a8a7e;
            --stone-soft: rgba(90, 138, 126, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { background: var(--paper); }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
            font-weight: 400;
            line-height: 2.2;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent, transparent 31px,
                var(--paper-rule) 31px, var(--paper-rule) 32px
            );
            pointer-events: none;
            z-index: 0;
        }

        .sidebar {
            position: fixed;
            left: 0; top: 0;
            width: 72px; height: 100vh;
            border-right: 1px solid var(--paper-rule);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 48px 0 32px;
            z-index: 100;
            background: rgba(247, 244, 236, 0.6);
            backdrop-filter: blur(4px);
        }

        .sidebar .vertical-mark {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-family: 'Noto Serif SC', serif;
            font-size: 0.8rem;
            letter-spacing: 0.5em;
            color: var(--ink-faint);
            font-weight: 300;
        }

        .sidebar .vertical-mark strong {
            color: var(--cinnabar);
            font-weight: 600;
        }

        .sidebar .corner-no {
            writing-mode: vertical-rl;
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 0.6rem;
            color: var(--ink-faint);
            opacity: 0.4;
            letter-spacing: 0.2em;
        }

        .main {
            margin-left: 72px;
            max-width: 680px;
            padding: 80px 56px 120px;
            position: relative;
            z-index: 10;
        }

        .header { margin-bottom: 64px; position: relative; }

        .seal-group {
            display: flex;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 36px;
        }

        .seal {
            width: 52px; height: 52px;
            border: 2px solid var(--cinnabar);
            color: var(--cinnabar);
            font-family: 'Noto Serif SC', serif;
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: inset 0 0 0 1px var(--cinnabar-soft);
            opacity: 0.85;
        }

        .seal-side {
            font-family: 'Noto Serif SC', serif;
            font-size: 0.75rem;
            color: var(--ink-faint);
            writing-mode: vertical-rl;
            letter-spacing: 0.3em;
            padding-bottom: 4px;
        }

        .name {
            font-family: 'Noto Serif SC', serif;
            font-size: 2.6rem;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: 0.2em;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .byline {
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 0.8rem;
            color: var(--ink-faint);
            letter-spacing: 0.15em;
            font-weight: 300;
        }

        .byline::before { content: '/* '; color: var(--stone); opacity: 0.6; }
        .byline::after { content: ' */'; color: var(--stone); opacity: 0.6; }

        .divider {
            width: 48px; height: 1px;
            background: linear-gradient(90deg, var(--cinnabar), transparent);
            margin: 40px 0;
            opacity: 0.4;
        }

        .prose {
            font-size: 1.05rem;
            color: var(--ink-light);
            line-height: 2.6;
            margin-bottom: 48px;
        }

        .prose p { margin-bottom: 1.8em; text-indent: 2em; }
        .prose p:first-child { text-indent: 0; }
        .prose p:first-child::first-letter {
            font-family: 'Noto Serif SC', serif;
            font-size: 3em;
            float: left;
            line-height: 1;
            margin-right: 10px;
            margin-top: 6px;
            color: var(--cinnabar);
            font-weight: 700;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--paper-rule);
            margin-bottom: 56px;
            border: 1px solid var(--paper-rule);
        }

        .info-cell {
            background: var(--paper);
            padding: 22px 28px;
            transition: background 0.3s;
        }
        .info-cell:hover { background: var(--paper-warm); }

        .info-cell .label {
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 0.6rem;
            color: var(--stone);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 6px;
            opacity: 0.8;
        }

        .info-cell .value {
            font-family: 'Noto Serif SC', serif;
            font-size: 0.95rem;
            color: var(--ink);
            font-weight: 400;
        }

        .guestbook {
            border-top: 1px solid var(--paper-rule);
            padding-top: 56px;
        }

        .guestbook-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 36px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .guestbook-title::before {
            content: '尺';
            color: var(--cinnabar);
            font-size: 0.9rem;
            font-weight: 700;
            border: 1px solid var(--cinnabar);
            width: 28px; height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .guestbook-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--paper-rule);
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-bottom: 56px;
        }

        .form-field { position: relative; }

        .form-field label {
            display: block;
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 0.6rem;
            color: var(--stone);
            letter-spacing: 0.15em;
            margin-bottom: 8px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .form-field input,
        .form-field textarea {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--paper-rule);
            color: var(--ink);
            font-family: 'Noto Serif SC', 'Noto Sans SC', serif;
            font-size: 1rem;
            padding: 10px 0;
            outline: none;
            transition: border-color 0.4s;
            line-height: 1.8;
        }

        .form-field input:focus,
        .form-field textarea:focus { border-bottom-color: var(--cinnabar); }

        .form-field input::placeholder,
        .form-field textarea::placeholder {
            color: var(--ink-faint);
            opacity: 0.5;
            font-style: italic;
        }

        .form-field textarea {
            min-height: 100px;
            resize: vertical;
            line-height: 2;
        }

        .submit {
            align-self: flex-start;
            background: transparent;
            border: 1px solid var(--ink-faint);
            color: var(--ink-light);
            font-family: 'Noto Serif SC', serif;
            font-size: 0.9rem;
            padding: 10px 36px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.15em;
            margin-top: 8px;
        }

        .submit:hover {
            border-color: var(--cinnabar);
            color: var(--cinnabar);
            background: var(--cinnabar-soft);
        }

        .messages { display: flex; flex-direction: column; gap: 0; }

        .message {
            border-bottom: 1px solid var(--paper-rule);
            padding: 28px 0;
            position: relative;
            transition: background 0.3s;
        }
        .message:hover { background: rgba(160, 140, 110, 0.03); }
        .message:first-child { border-top: 1px solid var(--paper-rule); }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .message-author {
            font-family: 'Noto Serif SC', serif;
            font-size: 1rem;
            color: var(--ink);
            font-weight: 600;
        }

        .message-author::before { content: '「'; color: var(--cinnabar); opacity: 0.6; }
        .message-author::after { content: '」'; color: var(--cinnabar); opacity: 0.6; }

        .message-time {
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 0.65rem;
            color: var(--ink-faint);
            opacity: 0.6;
            letter-spacing: 0.05em;
        }

        .message-body {
            font-size: 0.95rem;
            color: var(--ink-light);
            line-height: 2;
            text-indent: 2em;
        }

        .empty {
            text-align: center;
            padding: 56px 0;
            color: var(--ink-faint);
            opacity: 0.5;
            font-size: 0.9rem;
            font-style: italic;
            border-top: 1px solid var(--paper-rule);
            border-bottom: 1px solid var(--paper-rule);
        }

        .footer {
            margin-top: 96px;
            padding-top: 32px;
            border-top: 1px solid var(--paper-rule);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-left {
            font-family: 'Noto Serif SC', serif;
            font-size: 0.8rem;
            color: var(--ink-faint);
            opacity: 0.6;
            letter-spacing: 0.1em;
        }

        .footer-right { display: flex; gap: 28px; }

        .footer-right a {
            color: var(--ink-faint);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.3s;
            position: relative;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .footer-right a:hover { color: var(--cinnabar); }

        .footer-right a::after {
            content: '';
            position: absolute;
            bottom: -3px; left: 0;
            width: 0; height: 1px;
            background: var(--cinnabar);
            transition: width 0.3s;
        }
        .footer-right a:hover::after { width: 100%; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main { margin-left: 0; padding: 48px 28px 80px; }
            .name { font-size: 2rem; }
            .info-grid { grid-template-columns: 1fr; }
            .prose { font-size: 1rem; }
            .seal-group { gap: 14px; }
        }

        .toast {
            position: fixed;
            top: 32px; right: 32px;
            padding: 12px 28px;
            font-size: 0.9rem;
            font-family: 'Noto Serif SC', serif;
            opacity: 0;
            transform: translateY(-8px);
            transition: all 0.4s ease;
            pointer-events: none;
            z-index: 1000;
            background: var(--paper);
            border-left: 2px solid var(--cinnabar);
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            color: var(--ink);
        }

        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.ok { border-left-color: var(--stone); }
        .toast.err { border-left-color: var(--cinnabar); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="vertical-mark">微微<strong>赛博</strong></div>
        <div class="corner-no">FZ-001</div>
    </aside>

    <main class="main">

        <header class="header">
            <div class="seal-group">
                <div class="seal">方</div>
                <div class="seal-side">志凡印</div>
            </div>
            <h1 class="name">方志凡</h1>
            <div class="byline">fangzhifan</div>
        </header>

        <div class="prose">
            <p>在数字与纸墨之间，寻一种克制的存在。不逐霓虹，不逐喧哗，只做微微赛博的一枚节点。</p>
            <p>此处为数字居所，可留书一笺。技术不过手段，人心才是目的。若有缘读到这行字，便是有缘人。</p>
        </div>

        <div class="divider"></div>

        <div class="info-grid">
            <div class="info-cell">
                <div class="label">STATUS</div>
                <div class="value">在线</div>
            </div>
            <div class="info-cell">
                <div class="label">LOCATION</div>
                <div class="value">数字空间</div>
            </div>
            <div class="info-cell">
                <div class="label">ALIGNMENT</div>
                <div class="value">微微赛博</div>
            </div>
            <div class="info-cell">
                <div class="label">PROTOCOL</div>
                <div class="value">HTTP/1.1</div>
            </div>
        </div>

        <section class="guestbook">
            <h2 class="guestbook-title">尺牍</h2>

            <form class="form" id="guestbook-form">
                <div class="form-field">
                    <label>称呼</label>
                    <input type="text" id="name" placeholder="阁下尊姓大名" required>
                </div>
                <div class="form-field">
                    <label>留言</label>
                    <textarea id="message" placeholder="在此落笔..." required></textarea>
                </div>
                <button type="submit" class="submit">投递</button>
            </form>

            <div id="messages" class="messages">
                <div class="empty">暂无尺牍，虚位以待</div>
            </div>
        </section>

        <footer class="footer">
            <div class="footer-left">方志凡 — 微微赛博</div>
            <div class="footer-right">
                <a href="https://github.com/zhifanfang86-gif">GitHub</a>
                <a href="mailto:zhifanfang86@gmail.com">Mail</a>
            </div>
        </footer>

    </main>

    <div id="toast" class="toast"></div>

    <script>
        const API_URL = 'https://fangzhifan-guestbook.zhifanfang86.workers.dev';

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + (type === 'ok' ? 'ok' : 'err');
            requestAnimationFrame(() => t.classList.add('show'));
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function renderMessages(list) {
            const c = document.getElementById('messages');
            if (!list.length) {
                c.innerHTML = '<div class="empty">暂无尺牍，虚位以待</div>';
                return;
            }
            c.innerHTML = list.map(m => `
                <div class="message">
                    <div class="message-header">
                        <span class="message-author">${escapeHtml(m.name)}</span>
                        <span class="message-time">${m.time || ''}</span>
                    </div>
                    <div class="message-body">${escapeHtml(m.message)}</div>
                </div>
            `).join('');
        }

        async function loadMessages() {
            try {
                const r = await fetch(`${API_URL}/messages`, { cache: 'no-store' });
                if (r.ok) {
                    const data = await r.json();
                    renderMessages(data);
                    return;
                }
            } catch (e) {}
            const local = JSON.parse(localStorage.getItem('fz_messages') || '[]');
            renderMessages(local);
        }

        document.getElementById('guestbook-form').addEventListener('submit', async e => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const message = document.getElementById('message').value.trim();
            if (!name || !message) return;

            const entry = { name, message, time: new Date().toLocaleString('zh-CN') };

            try {
                const r = await fetch(`${API_URL}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(entry)
                });
                if (r.ok) {
                    showToast('已投递', 'ok');
                    loadMessages();
                } else {
                    throw new Error('API error');
                }
            } catch (e) {
                const local = JSON.parse(localStorage.getItem('fz_messages') || '[]');
                local.unshift(entry);
                localStorage.setItem('fz_messages', JSON.stringify(local.slice(0, 50)));
                showToast('已本地保存', 'ok');
                renderMessages(local);
            }
            e.target.reset();
        });

        loadMessages();
    </script>

</body>
</html>
